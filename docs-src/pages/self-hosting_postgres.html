    <p class="lead">All data lives in one Postgres database.</p>

    <h2 id="version">Version</h2>
    <p>Postgres 15 or newer. A managed database from your cloud works as well as your own.</p>

    <h2 id="size">Size</h2>
    <p>Token entries are small: no transcripts or prompts are stored. A 150-member organization stays well within a small database instance.</p>
